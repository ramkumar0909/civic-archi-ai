services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: civicarch
      POSTGRES_USER: civicarch
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicarch -d civicarch"]
      interval: 5s
      timeout: 3s
      retries: 10
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
volumes:
  postgres-data:
  ollama-data:
